[stepper_x]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA11
microsteps: 16
rotation_distance: 39.91
endstop_pin: PC7
position_endstop: -3
position_min: -10
position_max: 230
homing_speed: 130
homing_retract_dist: 10
second_homing_speed: 20

[tmc2209 stepper_x]
uart_pin: PA9
uart_address: 3
interpolate: true
run_current: 0.6
sense_resistor: 0.10
stealthchop_threshold: 0
driver_SGTHRS: 68

[stepper_y]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PA11
microsteps: 16
rotation_distance: 39.90
endstop_pin: !PB13
position_endstop: -0.5
position_min: -10
position_max: 230
homing_speed: 100
homing_retract_dist: 10
second_homing_speed: 20

[tmc2209 stepper_y]
uart_pin: PA10
uart_address: 3
interpolate: true
run_current: 1.3
sense_resistor: 0.10
stealthchop_threshold: 0
diag_pin: ^PA6
driver_SGTHRS: 90
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 3
driver_HSTRT: 1

[stepper_z]
step_pin: PB6
dir_pin: PB5
enable_pin: !PA11
microsteps: 32
rotation_distance: 7.985
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 241
homing_speed: 10
second_homing_speed: 5
homing_retract_dist: 3

[tmc2208 stepper_z]
uart_pin: PA4
interpolate: true
run_current: 0.6
sense_resistor: 0.10
stealthchop_threshold: 999999

[bed_mesh]
speed: 300
mesh_min: 5, 5
mesh_max: 215, 215
probe_count: 7, 7
fade_start: 5
fade_end: 50
algorithm: bicubic
horizontal_move_z: 3

