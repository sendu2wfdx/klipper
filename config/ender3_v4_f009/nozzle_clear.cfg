# F009 factory cleaning geometry.  Keep disabled until CS1237 calibration and
# single-probe safety validation have completed on the target toolhead.
[nozzle_clear]
enabled: False
touch_gain: 1.5
trigger_force: 75
erase_dir: False
random_ofs: 3, 2
zmax: 200

pre_clear_enable: True
pre_clear_probe_pos: 85, 224
pre_clear_start: 85, 224
pre_clear_temp: 170
pre_clear_touch_speed: 15
pre_clear_touch_cnt: 3
pre_clear_retract_dist: 2

clear_enable: True
clear_start: 89, 223
clear_lenght: 42, 3
clear_temp: 170
clear_speed: 12000
clear_cnt: 8
clear_upraise: 1.5
clear_closure_temp: 130

rub_enable: True
rub_start: 75, 223
rub_lenght: 6, 2
rub_speed: 6000
rub_upraise: -0.2
