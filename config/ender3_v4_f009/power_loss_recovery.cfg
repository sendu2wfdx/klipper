# V57 BL24C16F journal restoration. Recording remains disabled until the
# automatic XYZE/heater/fan restore sequence passes hardware safety testing.
[power_loss_recovery]
enabled: False
automatic_restore: False
# Explicitly change to assume_unchanged only after verifying that the Z axis
# cannot move during an outage and that the safe lift is mechanically valid.
z_restore_strategy: disabled
state_path: /mnt/UDISK/printer_data/config/power_loss_recovery.json
record_interval: 5
metadata_interval: 15
min_z: 0.6
min_g1: 18
writes_per_slot: 255
preheat_temp: 185
safe_z_lift: 5
prime_length: 9.3
resume_xy_speed: 3000
resume_z_speed: 600
slow_percent: 20
slow_restore_lines: 200
allow_tool_restore: False
