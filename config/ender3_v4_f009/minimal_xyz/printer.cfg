# Ender-3 V4 / F009 minimal motion bring-up configuration
# Scope: main motion MCU, X/Y/Z steppers, TMC UART and X/Y homing inputs.
# No heaters, extruder, fans, probe, bed mesh or automatic MCU flashing.
# The leveling MCU and LIS2DW are intentionally deferred during this phase.
#
# IMPORTANT:
# - G28 X and G28 Y are enabled.
# - G28 Z and bare G28 are deliberately blocked. This machine has no confirmed
#   independent Z endstop; production Z homing uses PRTouch V3.
# - Main-MCU PA15 below is only an otherwise-unused dummy pin that lets the
#   cartesian stepper section be instantiated while every Z homing path is
#   blocked.  It is not the PRTouch signal: the real pressure-side output is
#   nozzle_mcu:PA15 and the main-MCU step-side input is !PC7.
#   Do not remove the Z homing lock until PRTouch has passed hardware tests.

[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 100
max_accel: 1000
minimum_cruise_ratio: 0.5
max_z_velocity: 5
max_z_accel: 50
square_corner_velocity: 3.0

# Bring-up only: permits controlled axis tests before homing is validated.
# FORCE_MOVE bypasses endstops and software travel limits; remove or disable it
# in the production profile after the homing chain has passed hardware tests.
[force_move]
enable_force_move: True

[stepper_x]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA11
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_endstop: -7
position_min: -10
position_max: 230
homing_speed: 20
homing_retract_dist: 0
second_homing_speed: 5

# The factory V57 profile names PC7 directly as stepper_x's endstop.  With the
# public Klipper host, bind the TMC2209 DIAG signal explicitly and expose its
# virtual endstop; otherwise PC7 remains reported as triggered after retract.
[tmc2209 stepper_x]
uart_pin: PA9
diag_pin: ^PC7
uart_address: 3
interpolate: true
run_current: 0.6
sense_resistor: 0.10
stealthchop_threshold: 0
driver_SGTHRS: 68

[stepper_y]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PA11
microsteps: 16
rotation_distance: 40
endstop_pin: !PB13
position_endstop: 1
position_min: -10
position_max: 230
homing_speed: 20
homing_retract_dist: 5
second_homing_speed: 5

[tmc2209 stepper_y]
uart_pin: PA10
uart_address: 3
interpolate: true
run_current: 1.0
sense_resistor: 0.10
stealthchop_threshold: 0
diag_pin: ^PA6
driver_SGTHRS: 40
driver_TBL: 2
driver_TOFF: 3
driver_HEND: 3
driver_HSTRT: 1

[stepper_z]
step_pin: PB6
dir_pin: PB5
enable_pin: !PA11
microsteps: 32
rotation_distance: 8
endstop_pin: PA15
position_endstop: 0
position_min: -5
position_max: 241
homing_speed: 3
second_homing_speed: 1
homing_retract_dist: 2

# Physical driver: MS35776N. The factory firmware configures its compatible
# UART register subset through Klipper's unmodified TMC2208 frontend.
# It is not a TMC2208/TMC2209 and must not be used for sensorless Z homing.
[tmc2208 stepper_z]
uart_pin: PA4
interpolate: true
run_current: 0.6
sense_resistor: 0.10
stealthchop_threshold: 999999

# G28 X / G28 Y remain standard Klipper homing operations. Any request that
# contains Z is stopped before motion, including a bare G28.
[homing_override]
axes: z
gcode:
  { action_raise_error("F009 minimal bring-up: Z homing is locked until PRTouch V3 is verified; use G28 X and G28 Y only") }

[idle_timeout]
timeout: 300
gcode:
  M84

# Host/UI integration only.  These sections do not enable additional hardware.
[virtual_sdcard]
path: /mnt/UDISK/printer_data/gcodes

[display_status]

[pause_resume]

[respond]

[gcode_macro HOME_XY]
description: Home the two axes with confirmed physical endstops
gcode:
  G28 X
  G28 Y
