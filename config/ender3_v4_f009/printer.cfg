# Ender-3 V4 / F009 public-software staging configuration.
# Do not use for unattended printing until the items in README.md are closed.

[include mcu.cfg]
[include host_eeprom.cfg]
[include io_remap.cfg]
[include power_loss_recovery.cfg]
[include nozzle_clear.cfg]
[include motion.cfg]
[include toolhead.cfg]
[include sensors.cfg]
[include safety.cfg]

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 12000
minimum_cruise_ratio: 0.5
max_z_velocity: 40
max_z_accel: 1000
square_corner_velocity: 5.0

[idle_timeout]
timeout: 1800

[exclude_object]
