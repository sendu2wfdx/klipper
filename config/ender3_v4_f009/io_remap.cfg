# V57 X-homing interlock. In the original module these unqualified pins are
# explicitly resolved on nozzle_mcu, not the main MCU.
[io_remap]
src_pin: PB0
remap_pin: PA15
src_pullup: 1
remap_def: 1
filterNum: 1
periodTicks: 0

# The compatibility host defaults this legacy section to disabled and enables
# it only around stepper_x homing moves. periodTicks=0 preserves the original
# MCU default of 10us; filterNum=1 preserves its N+1 (two-sample) filter.
