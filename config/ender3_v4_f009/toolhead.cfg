[thermistor f009_hotend_thermistor]
temperature1: 25
resistance1: 98633
temperature2: 220
resistance2: 377
temperature3: 320
resistance3: 73

[extruder]
step_pin: nozzle_mcu:PB5
dir_pin: nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 8
rotation_distance: 4.08
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 80
max_extrude_only_distance: 1000
max_extrude_only_velocity: 40
max_extrude_only_accel: 2400
heater_pin: nozzle_mcu:PB8
sensor_type: f009_hotend_thermistor
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.028
control: pid
pid_Kp: 20.981
pid_Ki: 2.639
pid_Kd: 41.700
min_temp: 0
max_temp: 320

[tmc2209 extruder]
uart_pin: nozzle_mcu:PB11
tx_pin: nozzle_mcu:PB10
uart_address: 3
interpolate: true
run_current: 0.35
hold_current: 0.3
sense_resistor: 0.200
stealthchop_threshold: 0

[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 26.844
pid_Ki: 2.105
pid_Kd: 85.566
min_temp: 0
max_temp: 136

[verify_heater extruder]

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

[output_pin model_fan_power]
pin: nozzle_mcu:PB6
value: 1
shutdown_value: 0

[fan]
pin: !nozzle_mcu:PA11
cycle_time: 0.00004
hardware_pwm: false
shutdown_speed: 0

[heater_fan hotend_fan]
pin: !nozzle_mcu:PA9
enable_pin: nozzle_mcu:PB7
heater: extruder
heater_temp: 50
fan_speed: 1.0
shutdown_speed: 0
cycle_time: 0.010
hardware_pwm: false

[fan_feedback]
fan0_pin: ^nozzle_mcu:PA8
fan1_pin: ^nozzle_mcu:PB9
fan0_ppr: 2
fan1_ppr: 2

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: nozzle_mcu:PA1
