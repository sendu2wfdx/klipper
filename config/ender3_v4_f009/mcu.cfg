[mcu]
serial: /dev/ttyS2
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyS3
baud: 230400
restart_method: command

[mcu bed_mcu]
serial: /dev/ttyS4
baud: 230400
restart_method: command

[temperature_sensor mainboard_mcu]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor toolhead_mcu]
sensor_type: temperature_mcu
sensor_mcu: nozzle_mcu
min_temp: 0
max_temp: 110

[temperature_sensor bed_mcu]
sensor_type: temperature_mcu
sensor_mcu: bed_mcu
min_temp: -20
max_temp: 120

[temperature_sensor host]
sensor_type: temperature_host
sensor_path: /sys/class/thermal/thermal_zone0/temp
min_temp: 0
max_temp: 100
