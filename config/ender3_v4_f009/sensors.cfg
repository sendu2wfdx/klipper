[lis2dw toolhead]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
axes_map: y, z, x
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6

[lis2dw bed]
cs_pin: bed_mcu:PA4
spi_speed: 5000000
axes_map: y, x, z
spi_software_sclk_pin: bed_mcu:PA5
spi_software_mosi_pin: bed_mcu:PA7
spi_software_miso_pin: bed_mcu:PA6

[resonance_tester]
accel_chip_x: lis2dw toolhead
accel_chip_y: lis2dw bed
max_freq: 90
accel_per_hz: 75
probe_points: 110, 110, 100

# Electrical mapping confirmed from Creality's PRTouch V3 configuration.
# Calibration constants below are deliberately non-production placeholders.
# Do not home Z or probe until the implemented PA15/PC7 interlock is validated
# and counts_per_gram/reference_tare_counts are measured on the target machine.
[load_cell_probe]
sensor_type: cs1237
sclk_pin: nozzle_mcu:PB13
dout_pin: nozzle_mcu:PB14
sample_rate: 640
gain: 128
counts_per_gram: 1
reference_tare_counts: 0
z_offset: 0
speed: 5
samples: 1
samples_tolerance: 0.5
samples_tolerance_retries: 5
