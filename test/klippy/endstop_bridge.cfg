# Simulated dual-MCU cartesian printer; not a hardware pin map.
[include load_cell.cfg]

[mcu nozzle_mcu]
serial: /dev/ttyACM1

[endstop_bridge sync]
output_pin: !nozzle_mcu:PC1
receive_pin: ^!PC3

[endstop_bridge_input x]
bridge: sync
input_pin: ^nozzle_mcu:PC0

[endstop_bridge_input y]
bridge: sync
input_pin: ^!nozzle_mcu:PC2

[stepper_x]
endstop_pin: endstop_bridge_sync:x

[stepper_y]
endstop_pin: endstop_bridge_sync:y

[load_cell_probe]
sclk_pin: nozzle_mcu:PJ2
dout_pin: nozzle_mcu:PJ3
trigger_bridge: sync
