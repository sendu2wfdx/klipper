name: GD32 platform build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gd32:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi python3-pytest

      - name: Run GD32 source checks
        run: python3 -m pytest -q -p no:cacheprovider test/test_gd32_*.py

      - name: Build GD32 example configurations
        env:
          BUILD_ROOT: ${{ runner.temp }}/build-gd32
          JOBS: 2
        run: sh scripts/build-gd32-platform.sh

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gd32-firmware
          path: |
            ${{ runner.temp }}/build-gd32/*/klipper.bin
            ${{ runner.temp }}/build-gd32/*/klipper.dict
